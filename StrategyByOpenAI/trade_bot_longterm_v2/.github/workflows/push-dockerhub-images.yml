name: Build and push Docker Hub images

on:
  push:
    branches:
      - main
      - code-test
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build and push paper-trading images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate configuration
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Set repository variable DOCKERHUB_USERNAME."; exit 1; }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "Set repository secret DOCKERHUB_TOKEN."; exit 1; }
          python3 -m py_compile config.py run_swing_rotation_targets.py run_fyers_stream.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: image-tags
        run: |
          stream_tags="${DOCKERHUB_USERNAME}/fyers-tradebot-stream:build-${GITHUB_RUN_ID}"
          scanner_tags="${DOCKERHUB_USERNAME}/fyers-tradebot-nifty-scan:build-${GITHUB_RUN_ID}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            stream_tags="${stream_tags}"$'\n'"${DOCKERHUB_USERNAME}/fyers-tradebot-stream:latest"
            scanner_tags="${scanner_tags}"$'\n'"${DOCKERHUB_USERNAME}/fyers-tradebot-nifty-scan:latest"
          else
            stream_tags="${stream_tags}"$'\n'"${DOCKERHUB_USERNAME}/fyers-tradebot-stream:${GITHUB_REF_NAME}"
            scanner_tags="${scanner_tags}"$'\n'"${DOCKERHUB_USERNAME}/fyers-tradebot-nifty-scan:${GITHUB_REF_NAME}"
          fi
          {
            echo 'stream_tags<<EOF'
            echo "$stream_tags"
            echo 'EOF'
            echo 'scanner_tags<<EOF'
            echo "$scanner_tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FYERS stream image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fyers-stream
          push: true
          tags: ${{ steps.image-tags.outputs.stream_tags }}

      - name: Build and push NIFTY scan image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.nifty-scan
          push: true
          tags: ${{ steps.image-tags.outputs.scanner_tags }}

